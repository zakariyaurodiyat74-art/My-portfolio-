<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskly – Simple Todo App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .app {
      background: white;
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.1);
      overflow: hidden;
    }
    .header {
      background: #4f46e5;
      color: white;
      padding: 28px 24px;
      text-align: center;
    }
    .header h1 { font-size: 1.6rem; margin-bottom: 4px; }
    .header p { opacity: 0.9; font-size: 0.95rem; }

    .input-area {
      display: flex;
      padding: 20px;
      gap: 10px;
      border-bottom: 1px solid #e2e8f0;
    }
    .input-area input {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }
    .input-area input:focus { border-color: #4f46e5; }
    .input-area button {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .input-area button:hover { background: #4338ca; }

    .todo-list { list-style: none; max-height: 400px; overflow-y: auto; }
    .todo-item {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid #f1f5f9;
      gap: 12px;
    }
    .todo-item.completed span { text-decoration: line-through; color: #94a3b8; }
    .todo-item input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    .todo-item span { flex: 1; font-size: 1rem; }
    .delete-btn {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 1.1rem;
      cursor: pointer;
      opacity: 0.7;
    }
    .delete-btn:hover { opacity: 1; }

    .empty { text-align: center; padding: 40px 20px; color: #94a3b8; }
    .stats {
      padding: 16px 20px;
      background: #f8fafc;
      font-size: 0.9rem;
      color: #64748b;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>Taskly</h1>
      <p>Stay productive, one task at a time</p>
    </div>

    <div class="input-area">
      <input type="text" id="todoInput" placeholder="Add a new task..." autocomplete="off">
      <button onclick="addTodo()">Add</button>
    </div>

    <ul class="todo-list" id="todoList"></ul>
    <div class="stats">
      <span id="count">0 tasks</span>
      <button onclick="clearCompleted()" style="background:none;border:none;color:#4f46e5;cursor:pointer;font-weight:500;">Clear completed</button>
    </div>
  </div>

  <script>
    let todos = JSON.parse(localStorage.getItem('todos')) || [];

    function saveTodos() {
      localStorage.setItem('todos', JSON.stringify(todos));
      render();
    }

    function addTodo() {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();
      if (!text) return;
      todos.push({ id: Date.now(), text, completed: false });
      input.value = '';
      saveTodos();
    }

    function toggleTodo(id) {
      todos = todos.map(t => t.id === id ? {...t, completed: !t.completed} : t);
      saveTodos();
    }

    function deleteTodo(id) {
      todos = todos.filter(t => t.id !== id);
      saveTodos();
    }

    function clearCompleted() {
      todos = todos.filter(t => !t.completed);
      saveTodos();
    }

    function render() {
      const list = document.getElementById('todoList');
      const count = document.getElementById('count');

      if (todos.length === 0) {
        list.innerHTML = '<div class="empty">No tasks yet. Add one above!</div>';
      } else {
        list.innerHTML = todos.map(t => `
          <li class="todo-item ${t.completed ? 'completed' : ''}">
            <input type="checkbox" \( {t.completed ? 'checked' : ''} onchange="toggleTodo( \){t.id})">
            <span>${t.text}</span>
            <button class="delete-btn" onclick="deleteTodo(${t.id})">×</button>
          </li>
        `).join('');
      }
      count.textContent = `\( {todos.length} task \){todos.length !== 1 ? 's' : ''}`;
    }

    document.getElementById('todoInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') addTodo();
    });

    render();
  </script>
</body>
</html>
